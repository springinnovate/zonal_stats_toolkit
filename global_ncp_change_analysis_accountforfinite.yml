[project]
name = global_ncp_change_analysis_accountforfinite
global_work_dir = ./workdir
log_level = INFO

[job:country]
agg_vector = ./jeronimodata/vector_basedata/cartographic_ee_ee_r264_correspondence.gpkg
agg_field = nev_name
operations = mean,stdev,valid_count,total_count,p5,p95
base_raster_pattern=./jeronimodata/data_to_summarize/trying_again/*.tif

[job:continent]
agg_vector = ./jeronimodata/vector_basedata/cartographic_ee_ee_r264_correspondence.gpkg
agg_field = continent
operations = mean,stdev,valid_count,total_count,p5,p95
base_raster_pattern=./jeronimodata/data_to_summarize/trying_again/*.tif

